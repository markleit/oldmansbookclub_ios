name: Deploy API to Azure

on:
  push:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Merging several PRs in quick succession fires one run per push, and without this they deploy
# CONCURRENTLY — whichever finishes last wins, so prod can end up running an older commit than
# main. Queue them instead. cancel-in-progress is deliberately false: cancelling mid-publish
# could leave the App Service half-deployed. A queued run supersedes any earlier pending one, so
# the newest commit still deploys last.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  # #204 (C5) — this used to deploy the moment a push touched API/**, in parallel with the Tests
  # workflow, so a commit whose API integration tests failed could already be live in prod. Now a
  # push waits for that commit's "API integration" job and deploys only if it passed. It gates on
  # that job alone, not the whole Tests run: the iOS lane takes 20–65 min and doesn't exercise the
  # server, and the PR's own required checks have already run everything.
  # A manual run (workflow_dispatch) skips the wait — it's the deliberate override.
  wait-for-api-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Wait for this commit's API integration tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do   # 10 s apart, up to 25 min
            run_id=$(gh run list -R "$REPO" --workflow test.yml --commit "$SHA" --event push \
                       --json databaseId -q '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              conclusion=$(gh run view -R "$REPO" "$run_id" --json jobs \
                             -q '.jobs[] | select(.name == "API integration") | .conclusion')
              case "$conclusion" in
                success) echo "API integration passed (run $run_id)."; exit 0 ;;
                failure|cancelled|timed_out|skipped|action_required)
                  echo "::error::API integration $conclusion for $SHA (run $run_id) — not deploying."; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the API integration tests on $SHA."
          exit 1

  build-and-deploy:
    needs: wait-for-api-tests
    # `always()` so a manual run (where the wait job is skipped) still deploys; a push deploys
    # only when the wait job succeeded.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.wait-for-api-tests.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore API/BookClubApi.csproj

      - name: Publish
        run: dotnet publish API/BookClubApi.csproj --configuration Release --runtime linux-x64 --self-contained true --output ./publish

      - name: Zip publish output
        run: cd publish && zip -r ../deploy.zip .

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name oldmansbookclub-api \
            --resource-group oldmansbookclub-rg \
            --subscription c6c735c0-e3e6-452d-871d-ba10e3e32ae9 \
            --src-path deploy.zip \
            --type zip

      - name: Wait for readiness
        run: |
          set -e
          URL="https://oldmansbookclub-api.azurewebsites.net/health/ready"
          echo "Polling $URL (90s deadline)…"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/ready.out -w "%{http_code}" "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Ready after ${i} attempt(s)."
              cat /tmp/ready.out
              exit 0
            fi
            echo "Attempt ${i}: HTTP $code"
            sleep 3
          done
          echo "::error::API never became ready (last status: $code). Likely a migration or DB failure — check App Service logs."
          cat /tmp/ready.out || true
          exit 1
