name: Deploy API to Azure

on:
  push:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore API/BookClubApi.csproj

      - name: Publish
        run: dotnet publish API/BookClubApi.csproj --configuration Release --runtime linux-x64 --self-contained true --output ./publish

      - name: Zip publish output
        run: cd publish && zip -r ../deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name oldmansbookclub-api \
            --resource-group oldmansbookclub-rg \
            --subscription c6c735c0-e3e6-452d-871d-ba10e3e32ae9 \
            --src-path deploy.zip \
            --type zip
