name: Deploy API to Azure

on:
  push:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore API/BookClubApi.csproj

      - name: Build
        run: dotnet build API/BookClubApi.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish API/BookClubApi.csproj --configuration Release --no-build --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'oldmansbookclub-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
