name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Xcode 27 (GitHub preview image) — matches the toolchain releases are archived with and the
    # iOS 27 our users run; `macos-latest` still defaults to Xcode 26.6 (#185).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project OldMansBookClub.xcodeproj -scheme OldMansBookClub -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
