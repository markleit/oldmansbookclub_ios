name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

# Both jobs are BLOCKING (#126). Neither touches the network or a real backend, so flake should be
# near zero; if it isn't, the fix is the test, not continue-on-error. This is deliberately unlike
# lint.yml, which is advisory by design (#99).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Docker is preinstalled on ubuntu runners, which is the whole reason this job runs here
      # rather than on macOS: the tests need a real SQL Server, and macOS runners have no Docker.
      # Testcontainers pulls mcr.microsoft.com/mssql/server itself.
      - name: Run the API lane
        run: ./scripts/regression.sh --only api

  ios:
    name: iOS unit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      # The script resolves an installed simulator itself, so this does not pin a device name
      # that a future Xcode image will drop.
      - name: Run the iOS lane
        run: ./scripts/regression.sh --only ios
