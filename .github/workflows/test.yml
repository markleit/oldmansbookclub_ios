name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

# Both jobs are BLOCKING (#126). Neither touches the network or a real backend, so flake should be
# near zero; if it isn't, the fix is the test, not continue-on-error. This is deliberately unlike
# lint.yml, which is advisory by design (#99).
#
# Superseded runs are cancelled on PRs only (#204). On main every push's run must finish: the API
# deploy waits for its commit's "API integration" job (deploy-api.yml), so a cancelled run — a
# merge followed by a build-number bump, say — would silently skip deploying the merge. A group per
# commit SHA on main, not per branch: a per-branch group still keeps only ONE pending run, so a
# third push while the slow iOS lane runs would cancel the second.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Docker is preinstalled on ubuntu runners, which is the whole reason this job runs here
      # rather than on macOS: the tests need a real SQL Server, and macOS runners have no Docker.
      # Testcontainers pulls mcr.microsoft.com/mssql/server itself.
      - name: Run the API lane
        run: ./scripts/regression.sh --only api

  # #204 (C1) — build once, then run the unit tests and the two halves of the hermetic UI tests
  # on separate runners at the same time. This was one job that built and then ran everything in
  # sequence: 20–65 min, and a single flaky UI test re-ran the whole UI suite. Each job here calls
  # the same scripts/regression.sh a local run uses, so CI and "green on my machine" still mean the
  # same thing.
  ios-build:
    name: iOS build
    # Xcode 27 (GitHub preview image) so CI tests on iOS 27 like our users' phones (#185).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build the app and test bundles
        run: ./scripts/regression.sh --build-for-testing build/ci
      # tar, not the artifact action's own file walk: it keeps the .app's symlinks and modes, which
      # the simulator needs to install it.
      - name: Package the test bundles
        run: tar -C build/ci -czf ios-test-products.tgz Build/Products
      - uses: actions/upload-artifact@v7
        with:
          name: ios-test-products
          path: ios-test-products.tgz
          retention-days: 3

  ios-unit:
    name: iOS unit
    needs: ios-build
    runs-on: xcode-27
    env:
      # An iOS 27-only device name, so a co-installed older runtime is never picked by name;
      # regression.sh falls back to any available iPhone if the image doesn't have it.
      OMBC_SIMULATOR: iPhone 18 Pro
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ios-test-products
      - name: Unpack the test bundles
        run: mkdir -p build/ci && tar -C build/ci -xzf ios-test-products.tgz
      - name: Run the iOS unit tests
        run: ./scripts/regression.sh --only ios-unit --products build/ci

  ios-ui:
    name: iOS UI (${{ matrix.shard }}/2)
    needs: ios-build
    runs-on: xcode-27
    strategy:
      # Both halves always finish, so one red run shows every failing test, not half of them.
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      OMBC_SIMULATOR: iPhone 18 Pro
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ios-test-products
      - name: Unpack the test bundles
        run: mkdir -p build/ci && tar -C build/ci -xzf ios-test-products.tgz
      # The EULA-skip launch argument in HermeticTestCase.launch() must match the app's real
      # @AppStorage key (hasAcceptedEULA_v2) — when it didn't, a fresh CI VM failed every hermetic
      # test with "the app made no request to the stub" (fixed 2026-09-12).
      - name: Run hermetic UI tests, half ${{ matrix.shard }}
        run: ./scripts/regression.sh --only hermetic-${{ matrix.shard }} --products build/ci
