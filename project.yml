name: OldMansBookClub
options:
  bundleIdPrefix: com.markleit
configs:
  Debug: debug
  Release: release
settings:
  IPHONEOS_DEPLOYMENT_TARGET: '16.0'
packages:
  SignalRClient:
    url: https://github.com/dotnet/signalr-client-swift
    from: 1.0.0
targets:
  OldMansBookClub:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    entitlements:
      path: App/OldMansBookClub.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markleit.oldmansbookclub
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BCH6CDU76R
        MARKETING_VERSION: 1.6.1
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - package: SignalRClient
