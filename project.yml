name: OldMansBookClub
options:
  bundleIdPrefix: com.markleit
configs:
  Debug: debug
  Release: release
settings:
  IPHONEOS_DEPLOYMENT_TARGET: '16.0'
packages:
  SignalRClient:
    url: https://github.com/dotnet/signalr-client-swift
    from: 1.0.0
targets:
  OldMansBookClub:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    entitlements:
      path: App/OldMansBookClub.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: production
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.markleit.oldmansbookclub
      INFOPLIST_FILE: App/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: AKV2XU3684
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 2
    dependencies:
      - package: SignalRClient
