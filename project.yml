name: OldMansBookClub
options:
  bundleIdPrefix: com.markleit
configs:
  Debug: debug
  Release: release
settings:
  IPHONEOS_DEPLOYMENT_TARGET: '16.0'
packages:
  SignalRClient:
    url: https://github.com/dotnet/signalr-client-swift
    from: 1.0.0
targets:
  OldMansBookClub:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    settings:
      base:
        # Debug builds install under a SEPARATE bundle id (.dev) so they can sit alongside the
        # App Store build on a device instead of replacing it — see #120. The suffix is a build
        # setting rather than a hardcoded id so a one-off CarPlay debug session can still build
        # with the real id (CarPlay's managed entitlement is granted only to that App ID):
        #   xcodebuild ... OMBC_BUNDLE_SUFFIX="" \
        #     CODE_SIGN_ENTITLEMENTS=App/OldMansBookClub.entitlements
        # (both are needed — the real App ID AND the entitlements file that carries CarPlay)
        PRODUCT_BUNDLE_IDENTIFIER: com.markleit.oldmansbookclub$(OMBC_BUNDLE_SUFFIX)
        OMBC_BUNDLE_SUFFIX: ""
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/OldMansBookClub.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BCH6CDU76R
        MARKETING_VERSION: 1.9.4
        CURRENT_PROJECT_VERSION: 1
        # To re-enable the 🔊 audio diagnostics (AudioPlayerService.alog, for debugging the
        # wireless-CarPlay audio path), add AUDIO_DIAG here, then run `xcodegen generate`:
        #   SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) AUDIO_DIAG
      configs:
        Debug:
          APS_ENVIRONMENT: development
          OMBC_BUNDLE_SUFFIX: .dev
          # The .dev App ID has no CarPlay grant, so Debug signs against an entitlements file
          # that omits it. Keep in sync with the generated file above, minus carplay-audio.
          CODE_SIGN_ENTITLEMENTS: App/OldMansBookClub.Debug.entitlements
          # So the .dev app is visually unmistakable from the real one on a home screen —
          # different name suffix, different (unpolished, deliberately loud) icon.
          OMBC_DISPLAY_SUFFIX: (DEV)
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Debug
        Release:
          APS_ENVIRONMENT: production
          OMBC_DISPLAY_SUFFIX: ""
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SignalRClient

  # Unit tests (#32/#126). Hermetic: no simulator UI, no network, no backend — they construct
  # types directly and run in a couple of seconds, which is what lets them gate every PR.
  OldMansBookClubTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UnitTests
      # JSON fixtures generated by the API test suite (ContractFixtureTests) and committed. The
      # Swift side decodes them through the app's REAL decoders, so a change to a server DTO fails
      # on both sides of the wire in one run rather than at runtime on a device.
      - path: Tests/contract
        buildPhase: resources
    settings:
      base:
        DEVELOPMENT_TEAM: BCH6CDU76R
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OldMansBookClub

  OldMansBookClubUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    settings:
      base:
        DEVELOPMENT_TEAM: BCH6CDU76R
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OldMansBookClub
    # #126 — starts the hermetic UI tests' fake backend as a genuine macOS process, BEFORE this
    # target builds. A scheme-level pre-action was tried first and rejected: it runs with a
    # stripped environment (confirmed directly — no $SRCROOT, no $PROJECT_DIR, not even $PWD
    # pointed at the repo), apparently because XcodeGen does not wire an EnvironmentBuildable
    # reference into scheme pre/post actions the way it does for a target's own build phases. A
    # target build-phase script, by contrast, reliably gets full build settings, which is all this
    # actually needs.
    #
    # Why the stub has to be a real process at all, rather than code inside the test class: it was
    # a Swift NWListener created directly inside HermeticUITests — itself part of the
    # Simulator-hosted `-Runner.app`, a SEPARATE process from the app under test. Diagnosed
    # directly: that listener was reachable instantly from its OWN process (proven with a raw
    # URLSession call from inside the runner) but never reachable from the app being tested, ever,
    # for the full test duration — on a completely fresh device and in CI alike. iOS Simulator does
    # not reliably bridge loopback connections BETWEEN two Simulator-hosted apps, only from a
    # Simulator app to a genuine macOS host process — which is exactly why the live lane, talking
    # to a real `dotnet run` process, never had this problem.
    preBuildScripts:
      - name: "Start hermetic stub"
        script: |
          #!/bin/bash
          set -e
          cd "$SRCROOT"
          # Idempotent: a stub left over from an interrupted previous run (a crash, Xcode's Stop
          # button) must not be mistaken for a healthy one — always replace it.
          if [ -f /tmp/ombc-hermetic-stub.pid ]; then
            kill "$(cat /tmp/ombc-hermetic-stub.pid)" 2>/dev/null || true
            rm -f /tmp/ombc-hermetic-stub.pid
          fi
          nohup python3 scripts/hermetic_stub.py > /tmp/ombc-hermetic-stub.log 2>&1 &
          echo $! > /tmp/ombc-hermetic-stub.pid
          # Real readiness, not a fixed sleep — the script prints one line once its socket is
          # bound and accepting connections.
          for i in $(seq 1 50); do
            grep -q "listening on" /tmp/ombc-hermetic-stub.log 2>/dev/null && exit 0
            sleep 0.1
          done
          echo "hermetic stub did not start in time" >&2
          cat /tmp/ombc-hermetic-stub.log >&2
          exit 1
        # No output declared, so Xcode reruns this on every build rather than caching it —
        # correct here, since "is the stub already running" isn't expressible as a file timestamp.
        basedOnDependencyAnalysis: false

schemes:
  OldMansBookClub:
    build:
      targets:
        OldMansBookClub: all
        OldMansBookClubTests: [test]
        OldMansBookClubUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # Unit tests first: they are the fast, hermetic ones, so a failure surfaces in seconds
        # rather than after a simulator boot.
        - OldMansBookClubTests
        - OldMansBookClubUITests
