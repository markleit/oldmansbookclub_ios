name: OldMansBookClub
options:
  bundleIdPrefix: com.markleit
configs:
  Debug: debug
  Release: release
settings:
  IPHONEOS_DEPLOYMENT_TARGET: '16.0'
packages:
  SignalRClient:
    url: https://github.com/dotnet/signalr-client-swift
    from: 1.0.0
targets:
  OldMansBookClub:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    settings:
      base:
        # Debug builds install under a SEPARATE bundle id (.dev) so they can sit alongside the
        # App Store build on a device instead of replacing it — see #120. The suffix is a build
        # setting rather than a hardcoded id so a one-off CarPlay debug session can still build
        # with the real id (CarPlay's managed entitlement is granted only to that App ID):
        #   xcodebuild ... OMBC_BUNDLE_SUFFIX="" \
        #     CODE_SIGN_ENTITLEMENTS=App/OldMansBookClub.entitlements
        # (both are needed — the real App ID AND the entitlements file that carries CarPlay)
        PRODUCT_BUNDLE_IDENTIFIER: com.markleit.oldmansbookclub$(OMBC_BUNDLE_SUFFIX)
        OMBC_BUNDLE_SUFFIX: ""
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/OldMansBookClub.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BCH6CDU76R
        MARKETING_VERSION: 1.9.4
        CURRENT_PROJECT_VERSION: 1
        # To re-enable the 🔊 audio diagnostics (AudioPlayerService.alog, for debugging the
        # wireless-CarPlay audio path), add AUDIO_DIAG here, then run `xcodegen generate`:
        #   SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) AUDIO_DIAG
      configs:
        Debug:
          APS_ENVIRONMENT: development
          OMBC_BUNDLE_SUFFIX: .dev
          # The .dev App ID has no CarPlay grant, so Debug signs against an entitlements file
          # that omits it. Keep in sync with the generated file above, minus carplay-audio.
          CODE_SIGN_ENTITLEMENTS: App/OldMansBookClub.Debug.entitlements
          # So the .dev app is visually unmistakable from the real one on a home screen —
          # different name suffix, different (unpolished, deliberately loud) icon.
          OMBC_DISPLAY_SUFFIX: (DEV)
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Debug
        Release:
          APS_ENVIRONMENT: production
          OMBC_DISPLAY_SUFFIX: ""
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SignalRClient

  # Unit tests (#32/#126). Hermetic: no simulator UI, no network, no backend — they construct
  # types directly and run in a couple of seconds, which is what lets them gate every PR.
  OldMansBookClubTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UnitTests
      # JSON fixtures generated by the API test suite (ContractFixtureTests) and committed. The
      # Swift side decodes them through the app's REAL decoders, so a change to a server DTO fails
      # on both sides of the wire in one run rather than at runtime on a device.
      - path: Tests/contract
        buildPhase: resources
    settings:
      base:
        DEVELOPMENT_TEAM: BCH6CDU76R
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OldMansBookClub

  OldMansBookClubUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    settings:
      base:
        DEVELOPMENT_TEAM: BCH6CDU76R
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OldMansBookClub

schemes:
  OldMansBookClub:
    build:
      targets:
        OldMansBookClub: all
        OldMansBookClubTests: [test]
        OldMansBookClubUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # Unit tests first: they are the fast, hermetic ones, so a failure surfaces in seconds
        # rather than after a simulator boot.
        - OldMansBookClubTests
        - OldMansBookClubUITests
